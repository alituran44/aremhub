<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/aremhub-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AremHub – Yenilikçi Fikirler, Dijital Çözümler!</title>
    <meta name="description" content="Sınırları zorlayan fikirlerle dijital geleceğinizi inşa ediyoruz! Web tasarım, sosyal medya yönetimi, drone çekimi, fotoğraf ve video prodüksiyon çözümleri." />
    
    <!-- Google Fonts: Figtree & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CDN with custom palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              arem: {
                navy: '#0A284B',
                blue: '#194077',
                hoverBlue: '#226cba',
                lime: '#84CC16',
                limeHover: '#65A30D',
                cyan: '#00C4EE',
                dark: '#0B1118',
                card: '#FFFFFF',
                slate: '#F8FAFC',
                border: '#E2E8F0',
                body: '#334155'
              }
            },
            fontFamily: {
              sans: ['"Figtree"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
              display: ['"Figtree"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      ::selection {
        background-color: #0A284B;
        color: #84CC16;
      }
    </style>
  </head>
  <body class="bg-[#FAFAFA] text-[#0F172A] font-sans antialiased min-h-screen selection:bg-[#0A284B] selection:text-[#84CC16]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
