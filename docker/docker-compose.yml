version: '3.8'

networks:
  aremhub_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  postizdata:
  n8ndata:

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aremhub_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aremuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arempassword123}
      POSTGRES_DB: ${POSTGRES_DB:-aremhub_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aremhub_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aremuser -d aremhub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Redis Cache & Message Queue
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aremhub_redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - aremhub_net

  # -------------------------------------------------------------
  # 3. Postiz (Open Source Social Media Scheduler Engine)
  # -------------------------------------------------------------
  postiz:
    image: gitroomhq/postiz-app:latest
    container_name: aremhub_postiz
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://aremuser:arempassword123@postgres:5432/aremhub_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=aremhub_super_secret_jwt_key_2026
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - postizdata:/app/uploads
    networks:
      - aremhub_net

  # -------------------------------------------------------------
  # 4. n8n Automation Engine (Auto-Boost & Auto-Rules)
  # -------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: aremhub_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=aremhub_db
      - DB_POSTGRESDB_USER=aremuser
      - DB_POSTGRESDB_PASSWORD=arempassword123
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8ndata:/home/node/.n8n
    networks:
      - aremhub_net

  # -------------------------------------------------------------
  # 5. AremHub Enterprise Social & Ads Engine
  # -------------------------------------------------------------
  aremhub_engine:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aremhub_enterprise_engine
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - META_MARKETING_API_KEY=${META_MARKETING_API_KEY}
      - GOOGLE_ADS_DEV_TOKEN=${GOOGLE_ADS_DEV_TOKEN}
    depends_on:
      - postiz
      - n8n
    networks:
      - aremhub_net
